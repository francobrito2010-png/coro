<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Coro: una agenda diaria calmada. Una sola pantalla, timeline por duracion y 3 prioridades.">
<meta name="theme-color" content="#FCFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Coro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFAF8; --surface:#FFFFFF; --surface-2:#FBF8FB;
    --ink:#2C2833; --muted:#948FA0; --faint:#B7B1C0;
    --hairline:#EDE9F0; --hairline-2:#F3EFF4;
    --now:#C4607E; --now-soft:#F6E4EA;
    --gym:#F4D4CB;  --gym-ink:#9B5240;
    --work:#CBD8EC; --work-ink:#3F5878;
    --food:#F2DFB9; --food-ink:#8A6A2E;
    --rest:#CFE2D2; --rest-ink:#3F6B4A;
    --shadow:0 6px 18px -12px rgba(70,50,90,.28);
    --shadow-lg:0 20px 50px -24px rgba(60,40,80,.45);
    --sheet-scrim:rgba(44,40,51,.34);
    --ground:radial-gradient(130% 70% at 50% 0%, #F3ECF4 0%, #EDE7EE 45%, #E7E2EA 100%);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#17141C; --surface:#211C29; --surface-2:#1B1723;
      --ink:#ECE6F1; --muted:#9A93A8; --faint:#6E6779;
      --hairline:#2E2836; --hairline-2:#241F2C;
      --now:#E495B0; --now-soft:#3A2530;
      --gym:#4B322C;  --gym-ink:#F1C3B7;
      --work:#2E3B4E; --work-ink:#B9CDEA;
      --food:#4A3E22; --food-ink:#EBD59A;
      --rest:#2C4034; --rest-ink:#AEDDB9;
      --shadow:0 6px 18px -12px rgba(0,0,0,.5);
      --shadow-lg:0 24px 60px -24px rgba(0,0,0,.7);
      --sheet-scrim:rgba(0,0,0,.55);
      --ground:radial-gradient(130% 70% at 50% 0%, #201A28 0%, #191420 55%, #141019 100%);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17141C; --surface:#211C29; --surface-2:#1B1723;
    --ink:#ECE6F1; --muted:#9A93A8; --faint:#6E6779;
    --hairline:#2E2836; --hairline-2:#241F2C;
    --now:#E495B0; --now-soft:#3A2530;
    --gym:#4B322C;  --gym-ink:#F1C3B7;
    --work:#2E3B4E; --work-ink:#B9CDEA;
    --food:#4A3E22; --food-ink:#EBD59A;
    --rest:#2C4034; --rest-ink:#AEDDB9;
    --shadow:0 6px 18px -12px rgba(0,0,0,.5);
    --shadow-lg:0 24px 60px -24px rgba(0,0,0,.7);
    --sheet-scrim:rgba(0,0,0,.55);
    --ground:radial-gradient(130% 70% at 50% 0%, #201A28 0%, #191420 55%, #141019 100%);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--ground);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
  input,select{font:inherit;color:inherit}

  /* ---- app shell ---- */
  .app{
    position:relative;width:100%;max-width:430px;height:100dvh;
    background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  }
  @media (min-width:480px){
    body{padding:26px 16px}
    .app{height:min(880px,calc(100dvh - 52px));border-radius:38px;
      box-shadow:var(--shadow-lg), 0 0 0 1px var(--hairline);}
  }

  /* ---- header ---- */
  .head{padding:26px 24px 12px;flex:none}
  .head .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .greet{font-size:13px;color:var(--muted);letter-spacing:.2px}
  .date{font-family:'Fraunces',Georgia,serif;font-size:29px;font-weight:500;line-height:1.05;margin-top:3px;letter-spacing:-.01em}
  .date b{font-weight:600}
  .theme-btn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    color:var(--muted);border:1px solid var(--hairline);background:var(--surface)}
  .theme-btn:hover{color:var(--ink)}
  .theme-btn svg{width:19px;height:19px}

  /* ---- priorities ---- */
  .prio{margin:12px 20px 4px;background:var(--surface);border:1px solid var(--hairline);
    border-radius:22px;padding:15px 16px 10px;box-shadow:var(--shadow);flex:none}
  .prio h2{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;
    text-transform:uppercase;margin-bottom:8px}
  .task{display:flex;align-items:center;gap:12px;padding:7px 0}
  .dot{width:21px;height:21px;border-radius:50%;border:1.8px solid var(--faint);flex:none;
    position:relative;transition:background .18s,border-color .18s;background:transparent}
  .task.done .dot{background:var(--now);border-color:var(--now)}
  .task.done .dot::after{content:"";position:absolute;left:6.5px;top:3.5px;width:4px;height:8px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .task .txt{font-size:15px;flex:1;line-height:1.3;outline:none;border-radius:6px;padding:1px 3px;
    word-break:break-word}
  .task .txt:focus{box-shadow:0 0 0 2px var(--now-soft)}
  .task.done .txt{color:var(--muted);text-decoration:line-through}
  .task .del{opacity:0;flex:none;width:26px;height:26px;border-radius:50%;color:var(--faint);
    display:grid;place-items:center;transition:opacity .15s}
  .task:hover .del,.task:focus-within .del{opacity:1}
  .task .del:hover{color:var(--now);background:var(--now-soft)}
  .task .del svg{width:15px;height:15px}
  .add-prio{display:flex;align-items:center;gap:12px;padding:7px 3px;width:100%;
    color:var(--faint);font-size:14px;text-align:left}
  .add-prio:hover{color:var(--now)}
  .add-prio .plus{width:21px;height:21px;border-radius:50%;border:1.6px dashed currentColor;
    display:grid;place-items:center;flex:none;font-size:14px;line-height:1}

  /* ---- timeline ---- */
  .tl-wrap{flex:1;overflow-y:auto;padding:6px 22px 150px;-webkit-overflow-scrolling:touch}
  .tl-head{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 6px}
  .tl-head span{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
  .empty{color:var(--faint);font-size:13.5px;text-align:center;padding:22px 10px;line-height:1.5}
  .timeline{position:relative;margin-left:42px}
  .hour{position:absolute;left:-42px;width:36px;text-align:right;font-size:11px;color:var(--faint);
    transform:translateY(-6px);font-variant-numeric:tabular-nums}
  .line{position:absolute;left:-6px;right:0;border-top:1px solid var(--hairline-2)}
  .slot{position:absolute;left:-6px;right:0;cursor:pointer}
  .slot:hover{background:linear-gradient(var(--hairline-2),transparent);border-radius:8px}

  .block{position:absolute;left:2px;right:0;border-radius:14px;padding:8px 12px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:flex-start;cursor:pointer;
    box-shadow:0 2px 8px -6px rgba(60,40,80,.4);transition:transform .12s,filter .12s}
  .block:hover{filter:brightness(.98) saturate(1.05)}
  .block:active{transform:scale(.99)}
  .block .t{font-size:14px;font-weight:600;line-height:1.15}
  .block .h{font-size:11px;opacity:.8;margin-top:2px;font-variant-numeric:tabular-nums}
  .block.mini{flex-direction:row;align-items:center;gap:8px;padding:5px 12px}
  .block.mini .h{margin-top:0}
  .block.gym{background:var(--gym);color:var(--gym-ink)}
  .block.work{background:var(--work);color:var(--work-ink)}
  .block.food{background:var(--food);color:var(--food-ink)}
  .block.rest{background:var(--rest);color:var(--rest-ink)}

  .now-line{position:absolute;left:-30px;right:0;height:0;z-index:15;display:flex;align-items:center;
    pointer-events:none}
  .now-line::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--now);flex:none;
    box-shadow:0 0 0 4px var(--now-soft)}
  .now-line::after{content:"";flex:1;height:2px;background:var(--now);opacity:.5;margin-left:1px}
  .now-tag{position:absolute;left:-30px;transform:translateY(-15px);font-size:10px;font-weight:700;
    color:var(--now);letter-spacing:.3px;z-index:15;pointer-events:none}

  .night{margin:16px 0 4px -42px;display:flex;align-items:center;gap:8px;justify-content:center;
    font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--hairline);
    border-radius:16px;padding:12px;width:calc(100% + 42px);transition:background .15s}
  .night:hover{background:var(--surface-2);color:var(--ink)}

  /* ---- quick add ---- */
  .quick{position:absolute;left:12px;right:12px;bottom:80px;z-index:30;display:flex;gap:8px;
    overflow-x:auto;padding:6px 4px;scrollbar-width:none;
    -webkit-mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
  .quick::-webkit-scrollbar{display:none}
  .pill{flex:none;background:var(--surface);border:1px solid var(--hairline);border-radius:999px;
    padding:9px 15px;font-size:13px;font-weight:500;color:var(--ink);box-shadow:var(--shadow);
    display:flex;align-items:center;gap:7px;white-space:nowrap}
  .pill:active{transform:scale(.96)}
  .pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .pill.add{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

  /* ---- bottom nav ---- */
  .nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hairline);
    display:flex;z-index:35;padding-bottom:8px}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:10px;color:var(--faint)}
  .nav button.on{color:var(--ink);font-weight:600}
  .nav button.on svg{color:var(--now)}
  .nav svg{width:22px;height:22px}

  /* ---- toast ---- */
  .toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);z-index:60;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:11px 18px;
    border-radius:999px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;max-width:86%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---- sheet / modal ---- */
  .scrim{position:absolute;inset:0;background:var(--sheet-scrim);z-index:50;opacity:0;
    pointer-events:none;transition:opacity .28s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;background:var(--surface);
    border-radius:26px 26px 0 0;padding:10px 22px calc(22px + env(safe-area-inset-bottom));
    box-shadow:0 -18px 50px -24px rgba(60,40,80,.5);transform:translateY(102%);
    transition:transform .32s cubic-bezier(.22,.9,.3,1);max-height:88%;overflow-y:auto}
  .sheet.show{transform:translateY(0)}
  .grabber{width:38px;height:4px;border-radius:99px;background:var(--hairline);margin:4px auto 14px}
  .sheet h3{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;margin-bottom:16px;letter-spacing:-.01em}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;
    text-transform:uppercase;margin-bottom:7px}
  .field input[type=text],.field input[type=time],.field select{
    width:100%;background:var(--surface-2);border:1px solid var(--hairline);border-radius:13px;
    padding:12px 14px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;
    -webkit-appearance:none;appearance:none}
  .field input:focus,.field select:focus{border-color:var(--now);box-shadow:0 0 0 3px var(--now-soft)}
  .times{display:flex;gap:10px}
  .times .field{flex:1;margin-bottom:0}
  .cats{display:flex;gap:8px;flex-wrap:wrap}
  .cat{flex:1;min-width:70px;border:1.5px solid var(--hairline);border-radius:13px;padding:10px 6px;
    display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;
    color:var(--muted);transition:border-color .15s,background .15s}
  .cat i{width:16px;height:16px;border-radius:6px;display:block}
  .cat.sel{border-color:currentColor}
  .cat[data-cat=gym].sel{color:var(--gym-ink);background:var(--gym)}
  .cat[data-cat=work].sel{color:var(--work-ink);background:var(--work)}
  .cat[data-cat=food].sel{color:var(--food-ink);background:var(--food)}
  .cat[data-cat=rest].sel{color:var(--rest-ink);background:var(--rest)}
  .cat[data-gcat].sel{color:var(--now);border-color:var(--now);background:var(--now-soft)}
  .cat svg{width:100%;height:100%}
  .warn{color:var(--now);font-size:12.5px;margin:-4px 0 10px;min-height:16px;font-weight:500}
  .sheet-actions{display:flex;gap:10px;margin-top:8px}
  .btn{flex:1;border-radius:14px;padding:14px;font-size:15px;font-weight:600;text-align:center;
    transition:filter .15s,background .15s}
  .btn.primary{background:var(--ink);color:var(--bg)}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn.ghost{background:var(--surface-2);border:1px solid var(--hairline);color:var(--ink);flex:0 0 auto;padding:14px 18px}
  .btn.danger{background:var(--now-soft);color:var(--now);flex:0 0 auto;padding:14px 18px}
  .btn.danger:hover{filter:brightness(.97)}

  /* ---- clóset ---- */
  .closet{flex:1;overflow-y:auto;padding:6px 20px 150px;-webkit-overflow-scrolling:touch;display:none}
  .closet.on{display:block}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px}
  .sec-head h2{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
  .sec-head .count{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

  .looks-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
  .looks-row::-webkit-scrollbar{display:none}
  .look-card{flex:none;width:96px;background:var(--surface);border:1px solid var(--hairline);
    border-radius:16px;padding:8px;box-shadow:var(--shadow);cursor:pointer}
  .look-card .stack{height:78px;border-radius:11px;background:var(--surface-2);position:relative;overflow:hidden}
  .look-card .stack img{position:absolute;width:56%;height:56%;object-fit:contain;
    filter:drop-shadow(0 2px 4px rgba(60,40,80,.18))}
  .look-card .nm{font-size:12px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .look-card.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:var(--faint);border-style:dashed;min-height:110px}
  .look-card.add:hover{color:var(--now);border-color:var(--now)}
  .look-card.add .plus{width:30px;height:30px;border-radius:50%;border:1.6px dashed currentColor;
    display:grid;place-items:center;font-size:18px;line-height:1}

  .garment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .garment{background:var(--surface);border:1px solid var(--hairline);border-radius:15px;padding:8px;
    box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
  .garment:active{transform:scale(.97)}
  .garment .ph{height:92px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
  .garment .ph img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 2px 5px rgba(60,40,80,.16))}
  .garment .ph svg{width:44%;height:44%;color:var(--faint)}
  .garment .nm{font-size:12px;font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

  .closet-empty{text-align:center;color:var(--muted);padding:38px 18px 10px}
  .closet-empty .big{width:70px;height:70px;border-radius:50%;background:var(--surface);
    border:1px solid var(--hairline);display:grid;place-items:center;margin:0 auto 14px;color:var(--faint)}
  .closet-empty .big svg{width:34px;height:34px}
  .closet-empty h3{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .closet-empty p{font-size:14px;max-width:30ch;margin:0 auto}

  /* botón flotante añadir prenda */
  .fab{position:absolute;right:18px;bottom:88px;z-index:30;height:52px;border-radius:999px;
    background:var(--ink);color:var(--bg);display:none;align-items:center;gap:8px;padding:0 20px;
    font-size:14px;font-weight:600;box-shadow:var(--shadow-lg)}
  .fab.on{display:flex}
  .fab:active{transform:scale(.96)}
  .fab svg{width:19px;height:19px}

  /* preview de la prenda en la hoja */
  .g-preview{height:190px;border-radius:16px;background:var(--surface-2);border:1px solid var(--hairline);
    display:grid;place-items:center;overflow:hidden;margin-bottom:15px;position:relative}
  .g-preview img{max-width:100%;max-height:100%;object-fit:contain}
  .g-preview .spin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;background:color-mix(in srgb,var(--surface) 82%,transparent);
    font-size:12.5px;color:var(--muted);text-align:center;padding:0 24px}
  .loader{width:26px;height:26px;border-radius:50%;border:3px solid var(--hairline);
    border-top-color:var(--now);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* selector de look en el bloque */
  .look-pick{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
  .look-pick::-webkit-scrollbar{display:none}
  .look-chip{flex:none;border:1.5px solid var(--hairline);border-radius:12px;padding:8px 12px;
    font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;background:var(--surface-2)}
  .look-chip.sel{border-color:var(--now);color:var(--now);background:var(--now-soft)}

  /* multi-selección de prendas para el look */
  .pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-height:46vh;overflow-y:auto;padding:2px}
  .pick{background:var(--surface-2);border:2px solid var(--hairline);border-radius:13px;padding:6px;
    position:relative;cursor:pointer}
  .pick .ph{height:72px;border-radius:9px;display:grid;place-items:center;overflow:hidden}
  .pick .ph img{width:100%;height:100%;object-fit:contain}
  .pick .ph svg{width:42%;color:var(--faint)}
  .pick.sel{border-color:var(--now)}
  .pick .chk{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;
    background:var(--now);color:#fff;display:none;place-items:center;font-size:12px}
  .pick.sel .chk{display:grid}
  .block .look-tag{font-size:10.5px;opacity:.9;margin-top:2px;display:flex;align-items:center;gap:3px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <symbol id="i-coat" viewBox="0 0 48 48"><path fill="currentColor" d="M18 6l-9 6 3 7 3-2v19h24V17l3 2 3-7-9-6-6 4h-6z"/></symbol>
  <symbol id="i-shoe" viewBox="0 0 48 48"><path fill="currentColor" d="M6 30c0-4 4-5 7-6l6-3 3 5 5 1 4 3 8 2c2 .5 2 2 2 4v3H6z"/></symbol>
  <symbol id="i-bag" viewBox="0 0 48 48"><path fill="none" stroke="currentColor" stroke-width="3" d="M14 17h20l2.5 22h-25zM19 17c0-4 2-7 5-7s5 3 5 7"/></symbol>
  <symbol id="i-hanger" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M12 6a2 2 0 112 2c-1 0-2 1-2 2v1l8 5c1 .6 1 3-1 3H3c-2 0-2-2.4-1-3l8-5"/></symbol>
</defs></svg>
</style>
</head>
<body>
<div class="app" id="app">
  <header class="head">
    <div class="row">
      <div>
        <div class="greet" id="greet">Buenos días</div>
        <div class="date" id="date">—</div>
      </div>
      <button class="theme-btn" id="themeBtn" aria-label="Cambiar tema"></button>
    </div>
  </header>

  <section class="prio" aria-label="Prioridades de hoy">
    <h2>Lo importante de hoy</h2>
    <div id="prioList"></div>
  </section>

  <div class="tl-wrap" id="tlWrap">
    <div class="tl-head"><span>Tu día</span></div>
    <div class="timeline" id="timeline"></div>
    <button class="night" id="nightBtn"></button>
  </div>

  <div class="quick" id="quick">
    <button class="pill add" data-quick="new">＋ Añadir</button>
    <button class="pill" data-quick="gym"><i style="background:var(--gym-ink)"></i>Gym</button>
    <button class="pill" data-quick="work"><i style="background:var(--work-ink)"></i>Trabajo</button>
    <button class="pill" data-quick="food"><i style="background:var(--food-ink)"></i>Comida</button>
    <button class="pill" data-quick="rest"><i style="background:var(--rest-ink)"></i>Descanso</button>
  </div>

  <!-- vista clóset -->
  <div class="closet" id="closet">
    <div class="sec-head"><h2>Tus looks</h2></div>
    <div class="looks-row" id="looksRow"></div>
    <div id="garmentSections"></div>
  </div>

  <!-- botón flotante: añadir prenda -->
  <button class="fab" id="fab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Añadir prenda
  </button>
  <input type="file" id="photoInput" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">

  <nav class="nav" id="nav">
    <button class="on" data-tab="hoy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Hoy</button>
    <button data-tab="closet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4a2 2 0 112 2c-1 0-2 1-2 2v1l8 5c1 .6 1 3-1 3H5c-2 0-2-2.4-1-3l8-5"/></svg>Clóset</button>
    <button data-tab="notas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>Notas</button>
    <button data-tab="rutinas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 1 3 6.2M4 12v4m0-4h4"/></svg>Rutinas</button>
    <button data-tab="ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2m0 14v2m9-9h-2M5 12H3m14.5-6.5-1.4 1.4M7.9 16.1l-1.4 1.4m0-11.4 1.4 1.4m8.2 8.2 1.4 1.4"/></svg>Ajustes</button>
  </nav>

  <div class="toast" id="toast"></div>
  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grabber"></div>
    <h3 id="sheetTitle">Nuevo bloque</h3>
    <div class="field">
      <label for="fName">Nombre</label>
      <input type="text" id="fName" placeholder="p. ej. Entrenar, foco, comer…" autocomplete="off">
    </div>
    <div class="times">
      <div class="field"><label for="fStart">Empieza</label><input type="time" id="fStart" step="300"></div>
      <div class="field"><label for="fEnd">Termina</label><input type="time" id="fEnd" step="300"></div>
    </div>
    <div class="field">
      <label>Categoría</label>
      <div class="cats" id="cats">
        <button class="cat" data-cat="gym"><i style="background:var(--gym-ink)"></i>Gym</button>
        <button class="cat" data-cat="work"><i style="background:var(--work-ink)"></i>Trabajo</button>
        <button class="cat" data-cat="food"><i style="background:var(--food-ink)"></i>Comida</button>
        <button class="cat" data-cat="rest"><i style="background:var(--rest-ink)"></i>Descanso</button>
      </div>
    </div>
    <div class="field">
      <label for="fAlarm">Recordatorio</label>
      <select id="fAlarm">
        <option value="0">Sin aviso</option>
        <option value="5">Avísame 5 min antes</option>
        <option value="10">Avísame 10 min antes</option>
        <option value="15">Avísame 15 min antes</option>
        <option value="30">Avísame 30 min antes</option>
      </select>
    </div>
    <div class="field" id="lookField" hidden>
      <label>Look (opcional)</label>
      <div class="look-pick" id="lookPick"></div>
    </div>
    <div class="warn" id="warn"></div>
    <div class="sheet-actions">
      <button class="btn danger" id="deleteBtn" hidden>Borrar</button>
      <button class="btn primary" id="saveBtn">Guardar</button>
    </div>
  </div>

  <!-- hoja: prenda -->
  <div class="sheet" id="gSheet" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <div class="grabber"></div>
    <h3 id="gTitle">Nueva prenda</h3>
    <div class="g-preview" id="gPreview"></div>
    <div class="field">
      <label for="gName">Nombre (opcional)</label>
      <input type="text" id="gName" placeholder="p. ej. Camisa blanca" autocomplete="off">
    </div>
    <div class="field">
      <label>Categoría</label>
      <div class="cats" id="gCats"></div>
    </div>
    <div class="warn" id="gWarn"></div>
    <div class="sheet-actions">
      <button class="btn danger" id="gDelete" hidden>Borrar</button>
      <button class="btn primary" id="gSave">Guardar</button>
    </div>
  </div>

  <!-- hoja: armar look -->
  <div class="sheet" id="lSheet" role="dialog" aria-modal="true" aria-labelledby="lTitle">
    <div class="grabber"></div>
    <h3 id="lTitle">Armar un look</h3>
    <div class="field">
      <label for="lName">Nombre del look</label>
      <input type="text" id="lName" placeholder="p. ej. Oficina, café con amigas…" autocomplete="off">
    </div>
    <div class="field">
      <label>Elige prendas</label>
      <div class="pick-grid" id="pickGrid"></div>
    </div>
    <div class="warn" id="lWarn"></div>
    <div class="sheet-actions">
      <button class="btn danger" id="lDelete" hidden>Borrar</button>
      <button class="btn primary" id="lSave">Guardar look</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var HOUR_H = 64;          // altura por hora
  var DAY_START = 6, DAY_END = 23;   // vista por defecto
  var CATS = {
    gym:{label:"Gym"}, work:{label:"Trabajo"}, food:{label:"Comida"}, rest:{label:"Descanso"}
  };
  var QUICK = {
    gym:{name:"Gym",dur:60,cat:"gym"}, work:{name:"Trabajo",dur:120,cat:"work"},
    food:{name:"Comida",dur:60,cat:"food"}, rest:{name:"Descanso",dur:30,cat:"rest"}
  };
  var MONTHS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var DAYS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

  // ---- clóset: estado en memoria ----
  var GCATS=[
    {key:"top",label:"Tops",icon:"i-tee"},
    {key:"bottom",label:"Pantalones",icon:"i-pants"},
    {key:"dress",label:"Vestidos",icon:"i-dress"},
    {key:"outer",label:"Abrigos",icon:"i-coat"},
    {key:"shoes",label:"Zapatos",icon:"i-shoe"},
    {key:"accessory",label:"Accesorios",icon:"i-bag"}
  ];
  var closetGarments=[], closetLooks=[];
  var DB=null, _bgLib;
  var gEditing=null, gImg=null, gSelCat="top";
  var lEditing=null, lPick=[];
  var selLook=null, view="hoy";

  var $ = function(id){return document.getElementById(id);};
  var uid = function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
  function todayKey(d){d=d||new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
  function pad(n){return (n<10?"0":"")+n;}
  function fmt(min){var h=Math.floor(min/60),m=min%60;return h+":"+pad(m);}
  function toMin(v){if(!v)return null;var p=v.split(":");return (+p[0])*60+(+p[1]);}
  function toVal(min){return pad(Math.floor(min/60))+":"+pad(min%60);}

  // ---- estado + persistencia ----
  var KEY_PREFIX="coro:day:";
  var dayKey = todayKey();
  var state = load();

  function load(){
    var base={blocks:[],priorities:[],seeded:false};
    try{
      var raw=localStorage.getItem(KEY_PREFIX+dayKey);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    // primera vez del día: sembramos un ejemplo suave sólo si nunca se abrió la app
    var everRaw=null;
    try{everRaw=localStorage.getItem("coro:opened");}catch(e){}
    if(!everRaw){
      try{localStorage.setItem("coro:opened","1");}catch(e){}
      base.priorities=[
        {id:uid(),text:"Entrenar 45 min",done:false},
        {id:uid(),text:"Cerrar la propuesta",done:false},
        {id:uid(),text:"Llamar a mamá",done:false}
      ];
      base.blocks=[
        {id:uid(),name:"Gym",start:420,end:480,cat:"gym",alarm:10},
        {id:uid(),name:"Trabajo",start:540,end:780,cat:"work",alarm:0},
        {id:uid(),name:"Almuerzo",start:780,end:840,cat:"food",alarm:0},
        {id:uid(),name:"Trabajo",start:900,end:1050,cat:"work",alarm:0},
        {id:uid(),name:"Yoga",start:1170,end:1215,cat:"rest",alarm:15}
      ];
      base.seeded=true;
      try{localStorage.setItem(KEY_PREFIX+dayKey, JSON.stringify(base));}catch(e){}
    }
    return base;
  }
  function save(){
    try{localStorage.setItem(KEY_PREFIX+dayKey, JSON.stringify(state));}catch(e){}
  }

  // ---- tema ----
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4 12H2m20 0h-2M5.6 5.6 4.2 4.2m15.6 15.6-1.4-1.4m0-12.8 1.4-1.4M4.2 19.8l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function currentTheme(){
    var t=document.documentElement.getAttribute("data-theme");
    if(t) return t;
    return window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  }
  function paintThemeBtn(){$("themeBtn").innerHTML = currentTheme()==="dark"?SUN:MOON;}
  $("themeBtn").addEventListener("click",function(){
    var next=currentTheme()==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("coro:theme",next);}catch(e){}
    paintThemeBtn();
  });
  (function initTheme(){
    var saved=null; try{saved=localStorage.getItem("coro:theme");}catch(e){}
    if(saved) document.documentElement.setAttribute("data-theme",saved);
    paintThemeBtn();
  })();

  // ---- cabecera ----
  function renderHead(){
    var d=new Date(), h=d.getHours();
    var g = h<6?"Buenas noches" : h<13?"Buenos días" : h<20?"Buenas tardes" : "Buenas noches";
    $("greet").textContent=g;
    $("date").innerHTML = DAYS[d.getDay()]+", <b>"+d.getDate()+" "+MONTHS[d.getMonth()]+"</b>";
  }

  // ---- prioridades ----
  function renderPrio(){
    var wrap=$("prioList"); wrap.innerHTML="";
    state.priorities.forEach(function(p){
      var row=document.createElement("div");
      row.className="task"+(p.done?" done":"");
      var dot=document.createElement("button");
      dot.className="dot"; dot.setAttribute("aria-label", p.done?"Marcar como no hecha":"Marcar como hecha");
      dot.onclick=function(){p.done=!p.done;save();renderPrio();};
      var txt=document.createElement("div");
      txt.className="txt"; txt.contentEditable="true"; txt.spellcheck=false; txt.textContent=p.text;
      txt.oninput=function(){p.text=txt.textContent; save();};
      txt.onblur=function(){var v=txt.textContent.trim(); if(!v){removePrio(p.id);return;} if(v!==p.text){p.text=v;} txt.textContent=v; save();};
      txt.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();txt.blur();}};
      var del=document.createElement("button");
      del.className="del"; del.setAttribute("aria-label","Quitar prioridad");
      del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      del.onclick=function(){removePrio(p.id);};
      row.appendChild(dot);row.appendChild(txt);row.appendChild(del);
      wrap.appendChild(row);
    });
    if(state.priorities.length<3){
      var add=document.createElement("button");
      add.className="add-prio";
      add.innerHTML='<span class="plus">+</span> Añadir prioridad';
      add.onclick=addPrio;
      wrap.appendChild(add);
    }
  }
  function addPrio(){
    if(state.priorities.length>=3){toast("Con 3 basta — hoy vas ligera ✷");return;}
    var p={id:uid(),text:"",done:false};
    state.priorities.push(p); save(); renderPrio();
    // enfoca la nueva
    var rows=$("prioList").querySelectorAll(".task .txt");
    var last=rows[rows.length-1]; if(last){last.focus();}
  }
  function removePrio(id){
    state.priorities=state.priorities.filter(function(p){return p.id!==id;});
    save(); renderPrio();
  }

  // ---- timeline ----
  var expanded=false; // noche desplegada
  function renderTimeline(){
    var h0=expanded?0:DAY_START, h1=expanded?24:DAY_END;
    var tl=$("timeline");
    tl.innerHTML="";
    tl.style.height=((h1-h0)*HOUR_H)+"px";

    // huecos clicables por hora (para añadir)
    for(var hh=h0; hh<h1; hh++){
      var slot=document.createElement("div");
      slot.className="slot";
      slot.style.top=((hh-h0)*HOUR_H)+"px";
      slot.style.height=HOUR_H+"px";
      (function(hourStart){
        slot.onclick=function(){openSheet(null,{start:hourStart*60,end:(hourStart+1)*60});};
      })(hh);
      tl.appendChild(slot);
    }
    // líneas + horas
    for(var k=h0; k<=h1; k++){
      var top=(k-h0)*HOUR_H;
      var line=document.createElement("div"); line.className="line"; line.style.top=top+"px"; tl.appendChild(line);
      if(k<h1||expanded){
        var lab=document.createElement("div"); lab.className="hour"; lab.style.top=top+"px";
        lab.textContent=(k%24)+":00"; tl.appendChild(lab);
      }
    }
    // bloques
    state.blocks.slice().sort(function(a,b){return a.start-b.start;}).forEach(function(b){
      if(b.end<=h0*60||b.start>=h1*60) return; // fuera de la vista
      var top=(b.start-h0*60)/60*HOUR_H;
      var height=Math.max((b.end-b.start)/60*HOUR_H,22);
      var el=document.createElement("div");
      el.className="block "+b.cat+(height<40?" mini":"");
      el.style.top=top+"px"; el.style.height=height+"px";
      var alarmDot = b.alarm?' · ⏰':'';
      var lookName=null;
      if(b.lookId){for(var li=0;li<closetLooks.length;li++){if(closetLooks[li].id===b.lookId){lookName=closetLooks[li].name;break;}}}
      var lookTag=(lookName&&height>=54)?'<div class="look-tag">👗 '+esc(lookName)+'</div>':'';
      el.innerHTML='<div class="t">'+esc(b.name)+'</div><div class="h">'+fmt(b.start)+" – "+fmt(b.end)+alarmDot+'</div>'+lookTag;
      el.onclick=function(ev){ev.stopPropagation();openSheet(b,null);};
      tl.appendChild(el);
    });

    renderNow();
  }
  function renderNow(){
    var tl=$("timeline");
    var old=tl.querySelectorAll(".now-line,.now-tag");
    for(var i=0;i<old.length;i++) old[i].remove();
    var h0=expanded?0:DAY_START, h1=expanded?24:DAY_END;
    var d=new Date(), nowMin=d.getHours()*60+d.getMinutes();
    if(nowMin<h0*60||nowMin>h1*60) return;
    var top=(nowMin-h0*60)/60*HOUR_H;
    var tag=document.createElement("div"); tag.className="now-tag"; tag.style.top=top+"px"; tag.textContent="ahora";
    var ln=document.createElement("div"); ln.className="now-line"; ln.style.top=top+"px";
    tl.appendChild(tag); tl.appendChild(ln);
  }
  function renderNight(){
    var b=$("nightBtn");
    b.textContent = expanded ? "☾  Ocultar la noche" : "☾  23:00 – 6:00 · Noche · toca para ver";
  }
  $("nightBtn").addEventListener("click",function(){
    expanded=!expanded; renderTimeline(); renderNight();
  });

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  // ---- hoja (crear/editar bloque) ----
  var editing=null, selCat="work";
  function openSheet(block, prefill){
    editing=block;
    $("sheetTitle").textContent = block?"Editar bloque":"Nuevo bloque";
    $("deleteBtn").hidden = !block;
    $("warn").textContent="";
    if(block){
      $("fName").value=block.name;
      $("fStart").value=toVal(block.start);
      $("fEnd").value=toVal(block.end);
      selCat=block.cat;
      $("fAlarm").value=String(block.alarm||0);
    }else{
      $("fName").value="";
      var s=prefill&&prefill.start!=null?prefill.start:540;
      var e=prefill&&prefill.end!=null?prefill.end:s+60;
      $("fStart").value=toVal(s); $("fEnd").value=toVal(e);
      selCat=(prefill&&prefill.cat)||"work";
      $("fAlarm").value="0";
    }
    paintCats();
    selLook = block ? (block.lookId||null) : null;
    renderLookPick();
    showSheet(true);
    if(!block) setTimeout(function(){$("fName").focus();},320);
  }
  function paintCats(){
    var els=$("cats").querySelectorAll(".cat");
    els.forEach(function(c){c.classList.toggle("sel", c.getAttribute("data-cat")===selCat);});
  }
  $("cats").addEventListener("click",function(e){
    var c=e.target.closest(".cat"); if(!c)return;
    selCat=c.getAttribute("data-cat"); paintCats();
  });
  function closeSheets(){
    $("scrim").classList.remove("show");
    var ss=document.querySelectorAll(".sheet");
    for(var i=0;i<ss.length;i++) ss[i].classList.remove("show");
  }
  function openSheetEl(el){
    closeSheets();
    $("scrim").classList.add("show");
    el.classList.add("show");
  }
  function showSheet(on){ if(on){openSheetEl($("sheet"));} else {closeSheets();} }
  $("scrim").addEventListener("click",closeSheets);

  $("saveBtn").addEventListener("click",function(){
    var name=$("fName").value.trim();
    var s=toMin($("fStart").value), e=toMin($("fEnd").value);
    if(!name){$("warn").textContent="Ponle un nombre al bloque.";return;}
    if(s==null||e==null){$("warn").textContent="Indica hora de inicio y fin.";return;}
    if(e<=s){$("warn").textContent="La hora de fin debe ir después del inicio.";return;}
    var alarm=parseInt($("fAlarm").value,10)||0;
    if(editing){
      editing.name=name;editing.start=s;editing.end=e;editing.cat=selCat;editing.alarm=alarm;editing.lookId=selLook;
    }else{
      state.blocks.push({id:uid(),name:name,start:s,end:e,cat:selCat,alarm:alarm,lookId:selLook});
    }
    // si el bloque cae en la noche, despliega para que se vea
    if((s<DAY_START*60||e>DAY_END*60)&&!expanded){expanded=true;renderNight();}
    save(); renderTimeline(); showSheet(false);
    toast(editing?"Guardado":"Bloque añadido");
    editing=null;
  });
  $("deleteBtn").addEventListener("click",function(){
    if(!editing)return;
    state.blocks=state.blocks.filter(function(b){return b.id!==editing.id;});
    save(); renderTimeline(); showSheet(false); toast("Bloque borrado"); editing=null;
  });

  // ---- añadir rápido ----
  $("quick").addEventListener("click",function(e){
    var btn=e.target.closest("[data-quick]"); if(!btn)return;
    var q=btn.getAttribute("data-quick");
    if(q==="new"){openSheet(null,null);return;}
    var def=QUICK[q];
    var slot=findFreeSlot(def.dur);
    openSheet(null,{start:slot,end:slot+def.dur,cat:def.cat});
    $("fName").value=def.name;
  });
  function findFreeSlot(dur){
    var d=new Date(), nowMin=d.getHours()*60+d.getMinutes();
    var start=Math.max(DAY_START*60, Math.ceil(nowMin/30)*30);
    for(var t=start; t+dur<=DAY_END*60; t+=30){
      var clash=state.blocks.some(function(b){return t<b.end && (t+dur)>b.start;});
      if(!clash) return t;
    }
    return Math.min(start, (DAY_END*60)-dur);
  }

  // ---- navegación entre vistas ----
  function setView(v){
    view=v;
    var hoy=(v==="hoy"), cl=(v==="closet");
    document.querySelector(".prio").style.display = hoy?"":"none";
    $("tlWrap").style.display = hoy?"":"none";
    $("quick").style.display = hoy?"":"none";
    $("closet").classList.toggle("on",cl);
    $("fab").classList.toggle("on",cl);
    if(hoy){ renderHead(); }
    else if(cl){ $("greet").textContent="Tu armario"; $("date").innerHTML="Clóset"; }
    var btns=$("nav").querySelectorAll("button");
    for(var i=0;i<btns.length;i++){ btns[i].classList.toggle("on", btns[i].getAttribute("data-tab")===v); }
  }
  $("nav").addEventListener("click",function(e){
    var btn=e.target.closest("[data-tab]"); if(!btn)return;
    var tab=btn.getAttribute("data-tab");
    if(tab==="hoy"||tab==="closet"){ setView(tab); return; }
    var msg={notas:"Notas llega pronto ✎",rutinas:"Rutinas llega pronto ↻",ajustes:"Ajustes llega pronto"}[tab];
    toast(msg);
  });

  // ---- clóset: IndexedDB ----
  function openDB(){
    return new Promise(function(res,rej){
      if(!("indexedDB" in window)){ rej(new Error("no idb")); return; }
      var r=indexedDB.open("coro-db",1);
      r.onupgradeneeded=function(){
        var db=r.result;
        if(!db.objectStoreNames.contains("garments")) db.createObjectStore("garments",{keyPath:"id"});
        if(!db.objectStoreNames.contains("looks")) db.createObjectStore("looks",{keyPath:"id"});
      };
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){rej(r.error);};
    });
  }
  function idbAll(store){return new Promise(function(res){try{var q=DB.transaction(store).objectStore(store).getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){res([]);};}catch(e){res([]);}});}
  function idbPut(store,val){return new Promise(function(res){try{var q=DB.transaction(store,"readwrite").objectStore(store).put(val);q.onsuccess=function(){res(true);};q.onerror=function(){res(false);};}catch(e){res(false);}});}
  function idbDel(store,id){return new Promise(function(res){try{var q=DB.transaction(store,"readwrite").objectStore(store).delete(id);q.onsuccess=function(){res(true);};q.onerror=function(){res(false);};}catch(e){res(false);}});}

  function gById(id){for(var i=0;i<closetGarments.length;i++)if(closetGarments[i].id===id)return closetGarments[i];return null;}
  function svgUse(id){return '<svg viewBox="0 0 48 48"><use href="#'+id+'"/></svg>';}

  // ---- clóset: render ----
  function renderCloset(){
    var lr=$("looksRow"); lr.innerHTML="";
    closetLooks.forEach(function(lk){
      var c=document.createElement("div"); c.className="look-card";
      var imgs=(lk.garmentIds||[]).map(gById).filter(Boolean).slice(0,3);
      var pos=['left:8%;top:14%','right:8%;top:10%','left:28%;bottom:8%'];
      var stack='<div class="stack">'+imgs.map(function(g,i){return '<img src="'+g.img+'" style="'+(pos[i]||'')+'" alt="">';}).join('')+'</div>';
      c.innerHTML=stack+'<div class="nm">'+esc(lk.name)+'</div>';
      c.onclick=function(){openLook(lk);};
      lr.appendChild(c);
    });
    var addc=document.createElement("div"); addc.className="look-card add";
    addc.innerHTML='<span class="plus">+</span><span style="font-size:11px">Armar look</span>';
    addc.onclick=function(){ if(!closetGarments.length){toast("Añade prendas primero ✷");return;} openLook(null); };
    lr.appendChild(addc);

    var gs=$("garmentSections"); gs.innerHTML="";
    if(!closetGarments.length){
      gs.innerHTML='<div class="closet-empty"><div class="big">'+svgUse("i-hanger")+'</div>'+
        '<h3>Tu clóset está vacío</h3><p>Toca «Añadir prenda», hazle una foto y le quitamos el fondo por ti.</p></div>';
      return;
    }
    GCATS.forEach(function(cat){
      var items=closetGarments.filter(function(g){return g.cat===cat.key;});
      if(!items.length) return;
      var head=document.createElement("div"); head.className="sec-head";
      head.innerHTML='<h2>'+cat.label+'</h2><span class="count">'+items.length+'</span>';
      var grid=document.createElement("div"); grid.className="garment-grid";
      items.forEach(function(g){
        var el=document.createElement("div"); el.className="garment";
        el.innerHTML='<div class="ph"><img src="'+g.img+'" alt=""></div><div class="nm">'+esc(g.name||cat.label)+'</div>';
        el.onclick=function(){openGarment(g);};
        grid.appendChild(el);
      });
      gs.appendChild(head); gs.appendChild(grid);
    });
  }

  // ---- clóset: categorías en la hoja ----
  function renderGCats(){
    var w=$("gCats"); w.innerHTML="";
    GCATS.forEach(function(cat){
      var b=document.createElement("button");
      b.className="cat"+(cat.key===gSelCat?" sel":""); b.setAttribute("data-gcat",cat.key);
      b.innerHTML='<span style="display:block;width:18px;height:18px">'+svgUse(cat.icon)+'</span>'+cat.label;
      b.onclick=function(){gSelCat=cat.key;renderGCats();};
      w.appendChild(b);
    });
  }

  // ---- clóset: añadir prenda desde foto ----
  $("fab").addEventListener("click",function(){ $("photoInput").value=""; $("photoInput").click(); });
  $("photoInput").addEventListener("change",function(e){
    var file=e.target.files&&e.target.files[0]; if(!file)return;
    addGarmentFromFile(file);
  });
  function fileToDataURL(file,max){
    return new Promise(function(res){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth||400,h=img.naturalHeight||400,scale=Math.min(1,max/Math.max(w,h));
        var c=document.createElement("canvas"); c.width=Math.round(w*scale); c.height=Math.round(h*scale);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        try{ res(c.toDataURL("image/jpeg",0.9)); }catch(e){ res(null); }
      };
      img.onerror=function(){res(null);};
      var fr=new FileReader(); fr.onload=function(){img.src=fr.result;}; fr.onerror=function(){res(null);}; fr.readAsDataURL(file);
    });
  }
  function blobToDataURL(blob){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=function(){res(null);};fr.readAsDataURL(blob);});}
  async function removeBg(dataUrl){
    try{
      if(!_bgLib){ _bgLib=await import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm"); }
      var fn=_bgLib.removeBackground||(_bgLib.default&&_bgLib.default.removeBackground);
      if(!fn) return dataUrl;
      // sin publicPath: usa el CDN de datos por defecto de la librería (staticimgly)
      var blob=await fn(dataUrl,{ output:{format:"image/png"} });
      var out=await blobToDataURL(blob);
      return out||dataUrl;
    }catch(e){ return dataUrl; }
  }
  async function addGarmentFromFile(file){
    gEditing=null; gImg=null; gSelCat="top";
    $("gTitle").textContent="Nueva prenda"; $("gName").value=""; $("gDelete").hidden=true; $("gWarn").textContent="";
    renderGCats();
    var prev=$("gPreview");
    prev.innerHTML='<div class="spin"><div class="loader"></div>Preparando la foto…</div>';
    openSheetEl($("gSheet"));
    var dataUrl=await fileToDataURL(file,1000);
    if(!dataUrl){ prev.innerHTML='<div class="spin">No se pudo leer la foto. Prueba con otra.</div>'; return; }
    prev.innerHTML='<img src="'+dataUrl+'"><div class="spin"><div class="loader"></div>Quitando el fondo…<br>la primera vez puede tardar un poco</div>';
    var finalUrl=await removeBg(dataUrl);
    gImg=finalUrl;
    prev.innerHTML='<img src="'+finalUrl+'">';
  }
  function openGarment(g){
    gEditing=g; gImg=g.img; gSelCat=g.cat;
    $("gTitle").textContent="Editar prenda"; $("gName").value=g.name||""; $("gDelete").hidden=false; $("gWarn").textContent="";
    $("gPreview").innerHTML='<img src="'+g.img+'">';
    renderGCats(); openSheetEl($("gSheet"));
  }
  $("gSave").addEventListener("click",async function(){
    if(!gImg){ $("gWarn").textContent="Espera a que la foto termine de prepararse."; return; }
    var name=$("gName").value.trim();
    if(gEditing){ gEditing.name=name; gEditing.cat=gSelCat; gEditing.img=gImg; await idbPut("garments",gEditing); }
    else{ var g={id:uid(),name:name,cat:gSelCat,img:gImg,created:Date.now()}; closetGarments.unshift(g); await idbPut("garments",g); }
    closeSheets(); renderCloset(); toast(gEditing?"Prenda guardada":"Prenda añadida"); gEditing=null; gImg=null;
  });
  $("gDelete").addEventListener("click",async function(){
    if(!gEditing)return;
    var id=gEditing.id;
    await idbDel("garments",id);
    closetGarments=closetGarments.filter(function(x){return x.id!==id;});
    for(var i=0;i<closetLooks.length;i++){
      var lk=closetLooks[i], before=(lk.garmentIds||[]).length;
      lk.garmentIds=(lk.garmentIds||[]).filter(function(x){return x!==id;});
      if(lk.garmentIds.length!==before) await idbPut("looks",lk);
    }
    closeSheets(); renderCloset(); toast("Prenda borrada"); gEditing=null;
  });

  // ---- clóset: armar look ----
  function openLook(lk){
    lEditing=lk;
    $("lTitle").textContent=lk?"Editar look":"Armar un look";
    $("lName").value=lk?lk.name:""; $("lDelete").hidden=!lk; $("lWarn").textContent="";
    lPick=lk?(lk.garmentIds||[]).slice():[];
    renderPickGrid(); openSheetEl($("lSheet"));
  }
  function renderPickGrid(){
    var w=$("pickGrid"); w.innerHTML="";
    closetGarments.forEach(function(g){
      var sel=lPick.indexOf(g.id)>=0;
      var el=document.createElement("div"); el.className="pick"+(sel?" sel":"");
      el.innerHTML='<div class="ph"><img src="'+g.img+'" alt=""></div><div class="chk">✓</div>';
      el.onclick=function(){var i=lPick.indexOf(g.id); if(i>=0)lPick.splice(i,1); else lPick.push(g.id); renderPickGrid();};
      w.appendChild(el);
    });
  }
  $("lSave").addEventListener("click",async function(){
    var name=$("lName").value.trim();
    if(!name){$("lWarn").textContent="Ponle un nombre al look.";return;}
    if(lPick.length<1){$("lWarn").textContent="Elige al menos una prenda.";return;}
    if(lEditing){ lEditing.name=name; lEditing.garmentIds=lPick.slice(); await idbPut("looks",lEditing); }
    else{ var lk={id:uid(),name:name,garmentIds:lPick.slice(),created:Date.now()}; closetLooks.unshift(lk); await idbPut("looks",lk); }
    closeSheets(); renderCloset(); renderTimeline(); toast(lEditing?"Look guardado":"Look creado"); lEditing=null;
  });
  $("lDelete").addEventListener("click",async function(){
    if(!lEditing)return;
    var id=lEditing.id;
    await idbDel("looks",id);
    closetLooks=closetLooks.filter(function(x){return x.id!==id;});
    state.blocks.forEach(function(b){if(b.lookId===id)b.lookId=null;}); save();
    closeSheets(); renderCloset(); renderTimeline(); toast("Look borrado"); lEditing=null;
  });

  // ---- selector de look en el bloque ----
  function renderLookPick(){
    var f=$("lookField"), w=$("lookPick");
    if(!closetLooks.length){ f.hidden=true; return; }
    f.hidden=false; w.innerHTML="";
    var none=document.createElement("button"); none.className="look-chip"+(!selLook?" sel":""); none.type="button"; none.textContent="Ninguno";
    none.onclick=function(){selLook=null;renderLookPick();};
    w.appendChild(none);
    closetLooks.forEach(function(lk){
      var b=document.createElement("button"); b.type="button"; b.className="look-chip"+(selLook===lk.id?" sel":""); b.textContent=lk.name;
      b.onclick=function(){selLook=lk.id;renderLookPick();};
      w.appendChild(b);
    });
  }

  async function initCloset(){
    try{ DB=await openDB(); closetGarments=await idbAll("garments"); closetLooks=await idbAll("looks"); }
    catch(e){ DB=null; }
    renderCloset(); renderTimeline();
  }

  // ---- toast ----
  var toastT;
  function toast(msg){
    var t=$("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("show");},2200);
  }

  // ---- init ----
  renderHead(); renderPrio(); renderNight(); renderTimeline(); initCloset();

  // centra el scroll cerca de "ahora" al abrir
  setTimeout(function(){
    var d=new Date(), nowMin=d.getHours()*60+d.getMinutes();
    if(nowMin>DAY_START*60 && nowMin<DAY_END*60){
      var top=(nowMin-DAY_START*60)/60*HOUR_H;
      $("tlWrap").scrollTop=Math.max(0, top-200);
    }
  },60);

  // refresca "ahora" y la cabecera cada minuto
  setInterval(function(){renderNow(); renderHead();},60000);

  // si cambia el día del sistema mientras está abierta, recarga estado
  setInterval(function(){
    var k=todayKey();
    if(k!==dayKey){dayKey=k;state=load();renderHead();renderPrio();renderTimeline();}
  },30000);

  // reacciona al tema del sistema si no hay override manual
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){
    if(!document.documentElement.getAttribute("data-theme")) paintThemeBtn();
  });

  // gancho de pruebas (solo con ?debug=1; inerte en uso normal)
  if(/[?&]debug=1/.test(location.search)){
    function testImg(color){var c=document.createElement("canvas");c.width=c.height=80;var x=c.getContext("2d");x.fillStyle=color||"#CBD8EC";x.fillRect(10,10,60,60);return c.toDataURL("image/png");}
    window.coroTest={
      addGarment:async function(cat,name,color){var g={id:uid(),name:name||"",cat:cat||"top",img:testImg(color),created:Date.now()};closetGarments.unshift(g);await idbPut("garments",g);renderCloset();return g.id;},
      addLook:async function(name,ids){var lk={id:uid(),name:name,garmentIds:ids||[],created:Date.now()};closetLooks.unshift(lk);await idbPut("looks",lk);renderCloset();renderTimeline();return lk.id;},
      attachLook:function(blockIdx,lookId){state.blocks[blockIdx].lookId=lookId;save();renderTimeline();return state.blocks[blockIdx];},
      go:setView,
      snapshot:function(){return {view:view,garments:closetGarments.length,looks:closetLooks.length,blocks:state.blocks.length};},
      clear:async function(){var i;for(i=0;i<closetGarments.length;i++)await idbDel("garments",closetGarments[i].id);for(i=0;i<closetLooks.length;i++)await idbDel("looks",closetLooks[i].id);closetGarments=[];closetLooks=[];renderCloset();}
    };
  }
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
